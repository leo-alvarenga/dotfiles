# -*- conf -*-

[main]
term=xterm-256color
font=Recursive Mono Casual Static:size=11,style=Medium,JetBrainsMono Nerd Font:size=11,style=Medium
letter-spacing=0
vertical-letter-offset=0
box-drawings-uses-font-glyphs=no

[environment]

[bell]

[scrollback]

[url]

[cursor]

[mouse]
hide-when-typing=yes

[touch]

[colors]
# Everforest (Dark, Medium) Palette
# (matches the Everforest theme sourced in tmux.conf via everforest.conf)
alpha=1.0
foreground=d3c6aa   # fg
background=232a2e   # bg_dim

# Normal colors
regular0=232a2e   # bg_dim (black)
regular1=e67e80   # red
regular2=a7c080   # green
regular3=dbbc7f   # yellow
regular4=7fbbb3   # blue
regular5=d699b6   # purple
regular6=83c092   # aqua/cyan
regular7=d3c6aa   # white (fg)

# Bright colors
bright0=859289   # grey1
bright1=e69875   # orange
bright2=a7c080   # green
bright3=dbbc7f   # yellow
bright4=7fbbb3   # blue
bright5=d699b6   # purple
bright6=83c092   # cyan
bright7=d3c6aa   # fg

# --- Kanagawa Wave Palette (unused, kept for reference) ---
# alpha=1.0
# foreground=dcd7ba
# background=1f1f28
